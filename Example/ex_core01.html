<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코어 기초 연습 문제</title>
</head>
<body>
    <button onclick="showYear()">1.현재 년도 출력</button>
    <button onclick="showDay()">2.오늘 요일 출력</button>
    <button onclick="showTime()">3.현재 시간 출력</button>
    <button onclick="showDates()">4.하루 후, 일주일 후 날짜 출력</button>
    <button onclick="showWeekend()">5. 요일에 따른 메시지 출력</button>
    <p id="output"></p>
    
    <script>
        let output = document.getElementById('output');
        // 1. 현재 연도 출력
        // 문제: 현재 날짜를 Date 객체로 가져와서 콘솔에 "올해는 2026년입니다."
        // 형식으로 출력하세요.
        function showYear(){
            let year = new Date();
            let year01 = year.getFullYear();
            output.innerText = `올해는 ${year01}년 입니다.`;
        } 
        // 2. 오늘 요일 출력
        // 문제: 현재 날짜를 이용하여 오늘 요일을 한글로 출력하세요.
        // 예: "오늘은 화요일입니다."
        function showDay(){
            let day = new Date();
            let day01 = day.getDay();
            let week = ['일','월','화','수','목','금','토'];
            output.innerText = `오늘은 ${week[day01]}요일 입니다.`;
        }
        // 3. 현재 시간 출력
        // 문제: 현재 시간을 시:분:초 형식으로 출력하세요.
        // 예: "현재 시간: 14:35:20"
        function showTime(){
            let time = new Date();
            let time01 = time.toLocaleTimeString();
            output.innerText = `현재시간 ${time01}`;
        }

        // 4. 하루 후, 일주일 후 날짜 출력
        // 문제: 오늘 날짜를 기준으로 하루 후와 일주일 후 날짜를 출력하세요

        function showDates(){
            let date01 = new Date();

            let tomorrow = new Date(date01);
            tomorrow.setDate(date01.getDate()+1);

            let nextweek = new Date(date01);
            nextweek.setDate(date01.getDate()+7);

            output.innerHTML = `하루 후 : ${tomorrow.toLocaleDateString()}<br/>
                                일주일 후 :${nextweek.toLocaleDateString()}`; 
        }
        

        // 5.요일에 따라 메시지 출력
        // 문제: 오늘 요일이 주말(토,일)이면 "주말이에요!"
        // 평일이면 "열심히 일하는 날!"을 출력하세요.

        
    </script>
</body>
</html>
