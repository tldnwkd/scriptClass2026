<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급여계산 연습문제</title>
</head>
<body>
    <h2>직원 근무시간 급여 계산</h2>
    <p>근무시간 입력: <input type="text" id="time">&nbsp;<button onclick="calculate()">급여계산</button></p>
    <p id="output"></p>
    <script>
        
        let output =document.getElementById('output');
        let salary =document.getElementById('time');

        function calculate(){
            let time_price = 10000;
            let working = salary.value;
            let money = salary.value *10000;
            let greater = time_price*1.5; 
            let payment = (8*time_price)+((working-8)*greater);
            if(working > 0){
                switch(true){
                case working >=1 && working <=8 :
                output.innerText = 
                `급여: ${money}원
                근무 메시지: 정상근무
                급여 상태: 급여 있음`           
                break;
                case working >8 :
                output.innerText = 
                `급여: ${payment}원
                근무 메시지: 초과근무
                급여 상태: 급여 있음`
                break;
            }
            }else if(working ==0){
                output.innerText = `출근하지 않았습니다.`
            }else{
                output.innerText = `올바른 근무시간을 입력하세요.`
            }    
        }
    </script>
</body>
</html>
