<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 연습 기초문제</title>
</head>
<body>
    p1태그에 1번 인덱스 값 출력: <p id="p1"></p>
    p2태그에 slice를 이용하여 green과 blue의 값만 출력: <p id="p2"></p>
    p3태그에 for문을 이용하여 요소 출력: <p id="p3"></p>
    p4태그에 1~10까지 배열 생성 후, 짝수만 출력: <p id="p4"></p>
    p5태그에 score가 80이상이면 '합격',아니면 '불합격' 출력: <p id="p5"></p>
    <script> 
        // 문제 1) p1태그에 1번 인덱스 값 출력
        let numbers =[10,20,30,40,50,60];

        let p1 = document.getElementById('p1');
        let numbersp1 = numbers.shift();
        p1.innerText = numbersp1;

        // 문제2) p2태그에 slice를 이용하여 green과 blue의 값만 출력
        let colors =['red','green','blue','yellow'];

        let p2 = document.getElementById('p2');
        let colorsp2 = colors.slice(1,3);
        p2.innerText = colorsp2;

        // 문제3) p3태그에 for문을 이용하여 요소 출력
        let names = ['Jason','Alice','Candy'];

        let p3 = document.getElementById('p3');
        let namesp3 = "";
        for(let i =0; i<names.length; i++){
            namesp3 += names[i]+" "
        }
        p3.innerText = namesp3;
        console.log(namesp3);

        // 문제4) p4태그에 1~10까지 배열 생성 후, 짝수만 출력
        let nums = [];

        let p4 = document.getElementById('p4');
        let result01 ='';
        for(let i=0; i<=10; i++){
            nums.push(i)
            if((nums[i-1]%2)==0){
            result01 += nums[i-1] +" "
            }
        }
        p4.innerText = result01;
        
        // 문제5) p5태그에 score가 80이상이면 '합격',아니면 '불합격' 출력
        let scores = [90,75,60,100,88];

        let p5 = document.getElementById('p5');
        let result02 ='';
        for(let i=0; i<scores.length; i++){
            if(scores[i]>=80){
                result02 +='합격'+' ';
            }else{
                result02 +='불합격'+' ';
            }
        }
        p5.innerText =result02;
    </script>
</body>
</html>
