<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 심화문제2</title>
</head>
<body>
    <h1>배열+for문+if문 문제</h1>
    2번 숫자 배열 입력(예:12,7,5,20,33,18) <input type="text" id="text"><button onclick="outfoot()">결과확인</button>
    <p id="number"></p>
    <script>
        let text = document.getElementById('text');
        let number = document.getElementById('number');

        function outfoot(){
            let text01 = text.value;
            let result = '';
            let result2 = '';
            let scores= text01.split(',');
            for(let i=0; i<scores.length; i++){
                if(scores[i]%2 ==0){
                    result += scores[i]+','
                }else{
                    result2 += scores[i]+','
                }
            }
            
            let concatresult = '짝수:'+result.slice(0,-1).concat('/홀수:'+result2.slice(0,-1));
            number.innerText = concatresult;
        }
    </script>
</body>
</html>
