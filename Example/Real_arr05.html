    <p id="output"></p>

    <script>
        let output =document.getElementById('output');
        let names = ['홍길동', '개나리', '진달래'];
        let subjects = ['국어', '영어', '수학'];
        let scores = [
            [85, 90, 78], // 홍길동
            [92, 88, 95], // 개나리
            [76, 85, 83], // 진달래
        ];
        let total = [];
        let avg = [];
        let result =`<div>[학생별 총점과 평균]</div>`;
        function render(){
            let max = 0;
            for(let i=0; i<scores.length; i++){
                let sum = 0;
                for(let j=0; j<scores[i].length; j++){
                    sum += scores[i][j];
                    total[i] = sum;
                    avg[i] = sum/3;
                }
                // console.log(sum);
                // console.log(total);
                console.log(avg);
            }       
        }
        render();
    </script>
