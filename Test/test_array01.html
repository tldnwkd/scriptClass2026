<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열(Array) 기초설명</title>
</head>
<body>
    <script>
        // 1.기본 배열 선언과 초기화 하기
        let fruits =['사과','딸기','포도'];
        console.log(`fruits 출력 : ${fruits}`);

        // 2.numbers 배열에 1부터 5까지 숫자 넣고, 2번 인덱스 값 출력하기
        let numbers=[1,2,3,4,5];
        console.log(`numbers의 2번 값 : ${numbers[2]}`);
        // 배열의 데이터 타입은 배열 내부의 값과 상관없이 Object(객체)이다.
        console.log(`데이터 타입 numbers : ${typeof numbers}`);
        console.log(`데이터 타입 fruits : ${typeof fruits}`);

        // 3.배열의 길이를 세는 property length
        // property는 ()괄호가 존재하지 않는다.
        // method는 반드시 ()괄호가 존재한다
        let names =['Jason','Alice','Candy','Chris'];
        console.log(`names의 길이 :${names.length}`);

        // 4. 위의 numbers 배열을 이용하여 합계를 구하고 싶다:for문 이용
        let sum =0;
        for(let i=0; i<numbers.length; i++){
             sum +=numbers[i];
        }
        console.log(sum);

        // 5. 혼합 배열 arry01 선언
        let arry01 = [10,'Switch','2026-09-28'];
        console.log(`arry01의 요소 출력 : ${arry01}`);

        // 6. 배열 선언 두번째 방식
        let arry03 =Array(50,60,70);
        console.log(`arry03 요소출력: ${arry03}`);

        // 7.배열 선언 세번째 방식
        // 단, 현재 arry04 참조 변수는 빈 값이다.
        // 아래와 같이 빈값인 경우 자바스크립트는 아무것도 출력하지 않는다.
        let arry04 = new Array(3);
        console.log(`arry04 요소출력 : ${arry04}`);

        // 8.빈 배열을 출력하는 방식 fill()메소드를 이용하여 값을 지정하는 방식
        let arry05 =new Array(3).fill('A');
        console.log(`arry05 요소출력 : ${arry05}`);
        
        // 위의 arry05배열의 각 요소값을 1,2,3 으로 변경하여 출력하기
        for(let i=0; i<arry05.length; i++){
            arry05[i]= (i+1);
        }
        console.log(`arry05 요소를 1,2,3으로 출력 : ${arry05}`);
        
        
    </script>
</body>
</html>
