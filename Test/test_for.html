<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 : for</title>
</head>
<body>
    <h3>문제 : 1부터 10까지 출력</h3>
    <p id="output"></p>
    <script>
        // while(조건식){ 실행문 } => 조건이 만족할때까지 실행
        let num = 0;
        while(num<5){
            console.log(`num : ${num}`);
            num++;
            console.log(`num 누적 결과: ${num}`);
        }
        // Do ~ while
        // Do{ 실행문 } while(조건식); => 무조건 한번은 실행됨
        // 조건을 만족하지 않아도 무조건 한번 실행
        let count = 0;
        do{
            console.log(`무조건 한번은 출력~~`);
            count++;
            console.log(`count의 누적: ${count}`);
        }while(count<3);
        console.log(`count의 끝: ${count}`);

        // for문 : 조건이 만족할때까지 순회
        for(let i=0; i<10; i++){
            console.log(`반복 i : ${i}`);
        }
        // const 키워드는 재할당 자체가 안되기 때문에
        // 반복문 에서는 사용할 수 없다.
        // for(const i=0; i<10; i++){
        //     console.log(`반복 i : ${i}`);
        // }

        // 1부터 10까지 출력
        // p태그
        // for문 이용
        let output =document.getElementById('output');
        let text ="";    
            for(let i=1; i<=10; i++){
                text += "<strong>"+i+" "+"</strong>";
                console.log(`text 출력 : ${text}`)
                console.log(`i 출력 : ${i}`)
            }
            output.innerText = text;
            // output.innerHTML => 태그까지 같이 출력 
            output.innerHTML = text;
            
        
        

    </script>
</body>
</html>
